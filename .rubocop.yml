plugins:
  - rubocop-rake
  - rubocop-rspec
  - rubocop-yard

AllCops:
  NewCops: enable
  TargetRubyVersion: 3.2
  Exclude:
    - "bin/**/*"

Style/StringLiterals:
  Enabled: true
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  Enabled: true
  EnforcedStyle: double_quotes

Layout/LineLength:
  Enabled: false

Metrics:
  Enabled: false

Style/Documentation:
  Enabled: false

Naming/AccessorMethodName:
  Enabled: false

RSpec/ExampleLength:
  Enabled: false

RSpec/MultipleExpectations:
  Enabled: false

RSpec/MultipleMemoizedHelpers:
  Enabled: false

RSpec/DescribeClass:
  Exclude:
    - "spec/contract/**/*"

RSpec/SpecFilePathFormat:
  # OAuth reads more naturally as one word than the cop's literal
  # capital-letter-per-underscore transform (o_auth_spec.rb) would suggest.
  Exclude:
    - "spec/monzo_adaptor/oauth_spec.rb"
